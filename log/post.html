<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>기록 — jemmajeon 블로그</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="../assets/site.css">
<style>
.post{max-width:700px;margin:0 auto;padding:40px 0 0}
.post .back{font-size:14px;color:var(--muted);text-decoration:none}
.post h1{font-size:clamp(28px,4.6vw,38px);line-height:1.25;letter-spacing:-.03em;margin:14px 0 8px;text-wrap:balance}
.post .date{font:500 13px var(--f-mono);color:var(--muted)}
.prose{margin-top:28px;font-size:17px;line-height:1.85}
.prose h2{font-size:22px;margin:36px 0 8px;letter-spacing:-.02em}
.prose h3{font-size:18px;margin:28px 0 6px}
.prose p{margin:0 0 16px}
.prose ul,.prose ol{padding-left:22px;margin:0 0 16px}
.prose blockquote{margin:0 0 16px;padding:4px 16px;border-left:3px solid var(--accent);color:var(--ink2)}
.prose code{font:14px var(--f-mono);background:var(--sunk);border-radius:4px;padding:1px 5px}
.prose img{border-radius:12px;display:block;margin:8px 0}
.prose a{color:var(--accent)}
</style>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LTC8L11Y7J"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-LTC8L11Y7J');</script>
</head>
<body>
<header class="topbar"><div class="wrap"><a class="brand" href="../">jemmajeon<span>블로그</span></a><nav class="tabs" aria-label="블로그"><a href="../">안내서</a><a href="./" aria-current="page">기록</a></nav></div></header>
<main class="wrap"><article class="post" id="post"><a class="back" href="./">← 기록 목록</a></article>
<footer class="site"><span>© jemmajeon</span><span><a href="https://jemmajeon.github.io/">홈</a></span></footer></main>
<script>
// 기록 본문 = log/<slug>.md. 지원: # 제목, 문단, - / 1. 목록, > 인용, **굵게**, *기울임*, `코드`, [링크](url), ![그림](url)
(function () {
  var root = document.getElementById("post"), slug = new URLSearchParams(location.search).get("p") || "";
  function esc(s) { return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;"); }
  function safeUrl(u) { return /^(https?:|\.\.?\/|\/|[\w-]+\.(png|jpe?g|webp|gif|svg)$)/i.test(u) ? u : "#"; }
  function inline(s) {
    s = esc(s);
    s = s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g, function (_, a, u) { return '<img alt="' + a + '" src="' + safeUrl(u) + '" loading="lazy">'; });
    s = s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g, function (_, t, u) { return '<a href="' + safeUrl(u) + '" target="_blank" rel="noopener">' + t + "</a>"; });
    return s.replace(/`([^`]+)`/g, "<code>$1</code>").replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>").replace(/\*([^*]+)\*/g, "<em>$1</em>");
  }
  function md(text) {
    var out = [], list = null, para = [];
    function flush() { if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; } if (list) { out.push("</" + list + ">"); list = null; } }
    text.replace(/\r/g, "").split("\n").forEach(function (line) {
      var m;
      if (!line.trim()) { flush(); return; }
      if ((m = line.match(/^(#{1,3})\s+(.*)/))) { flush(); var lv = Math.min(m[1].length + 1, 3); out.push("<h" + lv + ">" + inline(m[2]) + "</h" + lv + ">"); return; }
      if ((m = line.match(/^>\s?(.*)/))) { flush(); out.push("<blockquote><p>" + inline(m[1]) + "</p></blockquote>"); return; }
      if ((m = line.match(/^\s*([-*]|\d+\.)\s+(.*)/))) {
        var t = /\d/.test(m[1]) ? "ol" : "ul";
        if (para.length) { out.push("<p>" + inline(para.join(" ")) + "</p>"); para = []; }
        if (list !== t) { if (list) out.push("</" + list + ">"); out.push("<" + t + ">"); list = t; }
        out.push("<li>" + inline(m[2]) + "</li>"); return;
      }
      if (list) { out.push("</" + list + ">"); list = null; }
      para.push(line.trim());
    });
    flush(); return out.join("\n");
  }
  if (!/^[\w-]+$/.test(slug)) { root.insertAdjacentHTML("beforeend", '<p class="empty">기록을 찾지 못했어요.</p>'); return; }
  Promise.all([fetch("../posts.json", {cache: "no-cache"}).then(function (r) { return r.json(); }), fetch("./" + slug + ".md", {cache: "no-cache"}).then(function (r) { if (!r.ok) throw 0; return r.text(); })])
    .then(function (res) {
      var meta = res[0].posts.find(function (p) { return p.section === "log" && p.slug === slug; }) || {title: slug, date: ""};
      document.title = meta.title + " — jemmajeon 블로그";
      var h = document.createElement("h1"); h.textContent = meta.title; root.append(h);
      var d = document.createElement("div"); d.className = "date"; d.textContent = (meta.date || "").replace(/-/g, "."); root.append(d);
      var body = document.createElement("div"); body.className = "prose"; body.innerHTML = md(res[1]); root.append(body);
    }).catch(function () { root.insertAdjacentHTML("beforeend", '<p class="empty">기록을 불러오지 못했어요.</p>'); });
})();
</script>
</body>
</html>
