<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>jemmajeon 블로그 — 안내서</title>
<meta name="description" content="친구·가족과 만날 장소를 조사해 링크 하나로 나누는 모임·여행 안내서와 기록.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="./assets/site.css">
<script async src="https://www.googletagmanager.com/gtag/js?id=G-LTC8L11Y7J"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-LTC8L11Y7J',{site_section:'blog'});</script>
</head>
<body data-page="guides">
<header class="topbar"><div class="wrap"><a class="brand" href="./">jemmajeon<span>블로그</span></a><nav class="tabs" aria-label="블로그"><a href="./" aria-current="page">안내서</a><a href="./log/">기록</a></nav></div></header>
<main class="wrap">
  <section class="home-hero">
    <div class="eyebrow">JEMMAJEON · 안내서</div>
    <h1>같이 갈 곳을 미리 <em>조사해 두는</em> 안내서</h1>
    <p>모임·나들이·여행 전에 장소를 조사해서 링크 하나로 나눕니다. 다녀온 뒤의 이야기는 <a href="./log/">기록</a>에 씁니다.</p>
  </section>

  <div class="filters" role="group" aria-label="종류" id="filters"></div>
  <div id="list" data-zone="guide-list"><p class="empty">불러오는 중…</p></div>

  <footer class="site"><span>© jemmajeon</span><span><a href="https://jemmajeon.github.io/">홈</a> · 가격·영업시간은 조사 당시 기준</span></footer>
</main>
<script src="/assets/track.js"></script>
<script>
(function () {
  var state = {kind: "전체", data: null};
  function el(tag, cls, text) { var n = document.createElement(tag); if (cls) n.className = cls; if (text != null) n.textContent = text; return n; }
  function today() { var d = new Date(); return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"); }
  function fmt(s) { var d = new Date(s + "T00:00:00"); return d.getFullYear() + "." + String(d.getMonth() + 1).padStart(2, "0") + "." + String(d.getDate()).padStart(2, "0") + " " + "일월화수목금토"[d.getDay()]; }

  function card(p, past) {
    var a = el("a", "card gcard" + (past ? " is-past" : ""));
    a.href = p.file; if (p.external) { a.target = "_blank"; a.rel = "noopener"; }
    var top = el("div", "top"); top.append(el("span", "chip accent", p.kind || "안내"), el("span", "date", fmt(p.date))); a.append(top);
    a.append(el("h3", null, p.title + (p.external ? " ↗" : "")));
    if (p.tag) a.append(el("p", null, p.tag));
    var meta = el("div", "meta");
    if (p.area) meta.append(el("span", "chip", "📍 " + p.area));
    if (p.count) meta.append(el("span", "chip", "🏠 " + p.count + "곳"));
    if (past) meta.append(el("span", "chip past", "지난 안내"));
    a.append(meta);
    return a;
  }

  function render() {
    var posts = state.data.posts.filter(function (p) { return p.section === "guide" && p.listed !== false && (state.kind === "전체" || p.kind === state.kind); });
    posts.sort(function (a, b) { return a.date < b.date ? 1 : -1; });
    var t = today(), up = posts.filter(function (p) { return p.date >= t; }), past = posts.filter(function (p) { return p.date < t; });
    var list = document.getElementById("list"); list.replaceChildren();
    [["다가오는 안내", up, false], ["지난 안내", past, true]].forEach(function (g) {
      if (!g[1].length) return;
      var hd = el("div", "group-hd"); hd.append(el("h2", null, g[0]), el("span", null, g[1].length + "개")); list.append(hd);
      var grid = el("div", "grid"); g[1].forEach(function (p) { grid.append(card(p, g[2])); }); list.append(grid);
    });
    if (!posts.length) list.append(el("p", "empty", "이 종류의 안내서는 아직 없어요."));
  }

  fetch("./posts.json", {cache: "no-cache"}).then(function (r) { return r.json(); }).then(function (d) {
    state.data = d;
    var kinds = ["전체"].concat(d.kinds || []), f = document.getElementById("filters");
    kinds.forEach(function (k) {
      var b = el("button", null, k); b.type = "button"; b.setAttribute("aria-pressed", k === state.kind);
      b.onclick = function () { state.kind = k; f.querySelectorAll("button").forEach(function (x) { x.setAttribute("aria-pressed", x === b); }); render(); };
      f.append(b);
    });
    render();
  }).catch(function () { document.getElementById("list").replaceChildren(el("p", "empty", "목록을 불러오지 못했어요. 새로고침해 주세요.")); });
})();
</script>
</body>
</html>
